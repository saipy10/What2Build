<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="What2Build banner">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <!-- Accent gradient for logo -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Dot grid pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Dot grid overlay -->
  <rect width="1200" height="320" fill="url(#dotGrid)" rx="12"/>

  <!-- Subtle left accent line -->
  <rect x="0" y="0" width="4" height="320" fill="url(#logoGrad)" rx="2"/>

  <!-- Logo icon (3-block grid: indigo top-center, two dark bottom) -->
  <g transform="translate(80, 110)" filter="url(#glow)">
    <!-- Bottom-left dark block -->
    <rect x="0" y="52" width="40" height="40" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <!-- Bottom-right dark block -->
    <rect x="52" y="52" width="40" height="40" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <!-- Top-center indigo block -->
    <rect x="26" y="0" width="40" height="40" rx="8" fill="url(#logoGrad)"/>
    <!-- Inner shine on top block -->
    <rect x="26" y="0" width="40" height="18" rx="8" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- Wordmark: What2Build -->
  <text x="224" y="148" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" fill="#f9fafb">What</text>
  <text x="400" y="148" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" fill="url(#logoGrad)">2</text>
  <text x="432" y="148" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" letter-spacing="-2" fill="#f9fafb">Build</text>

  <!-- Tagline -->
  <text x="224" y="186" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#6b7280" letter-spacing="0.2">Turn engineering breakthroughs into projects you can build.</text>

  <!-- Divider line -->
  <line x1="224" y1="208" x2="800" y2="208" stroke="#1f2937" stroke-width="1"/>

  <!-- Tech badges row -->
  <!-- Next.js badge -->
  <g transform="translate(224, 224)">
    <rect width="84" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="42" y="18.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#9ca3af" text-anchor="middle">Next.js 16</text>
  </g>
  <!-- TypeScript badge -->
  <g transform="translate(316, 224)">
    <rect width="84" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="42" y="18.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">TypeScript</text>
  </g>
  <!-- Supabase badge -->
  <g transform="translate(408, 224)">
    <rect width="84" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="42" y="18.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Supabase</text>
  </g>
  <!-- Tailwind badge -->
  <g transform="translate(500, 224)">
    <rect width="84" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="42" y="18.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Tailwind CSS</text>
  </g>
  <!-- AI SDK badge -->
  <g transform="translate(592, 224)">
    <rect width="84" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="42" y="18.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">Vercel AI SDK</text>
  </g>

  <!-- Right-side decorative circles -->
  <circle cx="1050" cy="160" r="90" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.15"/>
  <circle cx="1050" cy="160" r="60" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.1"/>
  <circle cx="1050" cy="160" r="30" fill="#6366f1" opacity="0.07"/>
  <!-- Right icon hint: a small version of the logo -->
  <g transform="translate(1024, 134)" opacity="0.4">
    <rect x="0" y="26" width="20" height="20" rx="4" fill="#374151"/>
    <rect x="26" y="26" width="20" height="20" rx="4" fill="#374151"/>
    <rect x="13" y="0" width="20" height="20" rx="4" fill="#6366f1"/>
  </g>
</svg>
